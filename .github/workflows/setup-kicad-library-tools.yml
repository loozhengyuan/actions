name: setup-kicad-library-tools

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run action
        uses: ./setup-kicad-library-tools

      - name: Verify installation
        shell: bash
        run: |
          klc-footprint --help
          klc-symbol --help

  test-version:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run action
        uses: ./setup-kicad-library-tools
        with:
          version: "36d1ed208379d7c4127661ac384118cc6837392b"

      - name: Verify installation
        shell: bash
        run: |
          klc-footprint --help
          klc-symbol --help
